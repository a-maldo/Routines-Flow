<head>

<style>
  :root{
    --brand:#0f172a; --bg2:#f6f8fb; --ink:#0b1220;
    --accent:#ec4899;      /* piso */
    --accent-alt:#f59e0b;  /* viga */
    --accent-salto:#10b981;/* salto */
    --accent-barra:#6366f1;/* barra */
    --radius:20px; --safe:max(16px, env(safe-area-inset-bottom, 16px));
    --shadow: 0 8px 28px rgba(0,0,0,.08);
    --shadow-strong: 0 10px 22px rgba(15,23,42,.18);
    --note-shadow: 0 8px 18px rgba(0,0,0,.18);
  }

  *{box-sizing:border-box}
  html,body{overscroll-behavior:none; touch-action:manipulation;}
  body{margin:0;background:var(--bg2);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;display:flex;justify-content:center;padding:8px;min-height:100dvh}
  .game{position:relative;width:100%;max-width:500px;height:calc(100dvh - 16px);max-height:920px;border-radius:var(--radius);background:linear-gradient(#fff,#F2F5FA);overflow:hidden;border:1px solid #e5e7eb;box-shadow:var(--shadow)}

  .topbar{position:absolute;left:0;right:0;top:0;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;z-index:30;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));border-bottom:1px solid #eef2f7}
  .title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .chip{background:#eef2f7;border-radius:999px;padding:4px 8px;font-size:12px}
  .btn-icon{border:1px solid #e5e7eb;background:#fff;padding:8px;border-radius:10px;cursor:pointer}

  .stage{position:absolute;left:10px;right:10px;top:56px;bottom:130px;border-radius:18px;border:1px solid #fff;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.72));overflow:hidden}
  .lanes{position:absolute;inset:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .lane{position:relative;background:rgba(255,255,255,.7);border:1px solid #fff;border-radius:16px;overflow:visible}

  /* Etiqueta fija de la destreza (no se mueve) */
  .note-label{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    padding:4px 8px;border-radius:999px;font-weight:900;font-size:12px;color:#0b1220;
    background:rgba(255,255,255,.95);border:1px solid #e5e7eb;box-shadow:0 4px 12px rgba(0,0,0,.08);
    white-space:nowrap;user-select:none;pointer-events:none;z-index:5;
  }

  /* Nota vacía descendente */
  .note{position:absolute;left:50%;transform:translateX(-50%);border-radius:999px;color:#fff;font-weight:800;font-size:13px;padding:8px 14px;box-shadow:var(--note-shadow);border:1px solid rgba(255,255,255,.35);user-select:none;cursor:pointer;max-width:180px;text-align:center;will-change:transform}
  .note.piso{background:var(--accent)} .note.viga{background:var(--accent-alt)}
  .note.salto{background:var(--accent-salto)} .note.barra{background:var(--accent-barra)}

  /* Línea de golpe */
  .target{position:absolute;left:50%;transform:translateX(-50%);width:78%;max-width:170px;display:flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:999px;background:#0f172a;color:#fff;font-weight:900;box-shadow:var(--shadow-strong);user-select:none;cursor:pointer;z-index:20;transition:transform .08s ease}

  .target.bounce{animation:bounceTap .18s ease}

  .hitline-global{position:absolute;left:10px;right:10px;height:6px;border-radius:999px;background:#3b82f6;z-index:15;transition:background-color .22s ease}
  .hitline-perfect{background:#22c55e!important}.hitline-good{background:#eab308!important}.hitline-miss{background:#ef4444!important}
  @keyframes flashLine{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}100%{box-shadow:0 0 20px 8px rgba(255,255,255,0)}}

  .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -12px 24px rgba(0,0,0,.06);border-top:1px solid #eef2f7;padding:14px;z-index:25;padding-bottom:var(--safe)}

  .stack{display:grid;gap:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .pillset{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:8px 12px;border-radius:999px;background:#e6e9f2;color:#111827;font-weight:700;font-size:12px;border:1px solid #e5e7eb;cursor:pointer}

  .field{display:flex;flex-direction:column;gap:6px}

  .input{padding:12px 12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:700;color:var(--ink);caret-color:var(--ink);color-scheme: light;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;border:1px solid #0f172a;background:#0f172a;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.18)}
  .btn.alt{background:#f3f6fb;color:#0f172a;border-color:#e5e7eb}
  .btn:disabled{opacity:.55;cursor:default;filter:saturate(.6)}

  .leaderboard{margin-top:10px;border:1px solid #eef2f7;border-radius:14px;background:#fff;overflow:hidden}
  .leaderboard h4{margin:0;padding:10px 12px;font-size:13px;background:#f8fafc;border-bottom:1px solid #eef2f7}
  .leaderboard table{width:100%;border-collapse:collapse}
  .leaderboard thead th{background:#ffffff;font-weight:800;color:#0b1220}
  .leaderboard td,.leaderboard th{padding:10px 12px;font-size:13px;border-top:1px solid #f1f5f9;text-align:left;white-space:nowrap}
  .leaderboard tbody tr:nth-child(even){background:#f8fafc}
  .leaderboard .pos{width:36px;text-align:center}

  .results{position:absolute;inset:0;background:rgba(255,255,255,.96);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:40;padding-bottom:var(--safe);opacity:1;transition:opacity .18s ease}
  .results.locked{pointer-events:none;opacity:.98}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .kpi{padding:10px;border:1px solid #e5e7eb;border-radius:12px}
  .ok{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fef2f2}
  .medal{margin-top:8px;font-weight:900}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}

  .progress{position:absolute;left:12px;right:12px;bottom:12px;height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden}
  .progress>div{height:100%;width:0%}

  .float{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;font-size:12px;padding:4px 8px;border-radius:999px;color:#fff;pointer-events:none;opacity:.95;animation:upFade .6s ease-out forwards}
  .float.perfect{background:#22c55e}.float.good{background:#f59e0b}.float.miss{background:#ef4444}
  @keyframes upFade{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px)}}

  .pausedMask{position:absolute;inset:0;background:rgba(15,23,42,.35);color:#fff;display:none;align-items:center;justify-content:center;z-index:35;backdrop-filter:blur(1px)}
  .pausedMask .box{background:rgba(15,23,42,.9);padding:16px 20px;border-radius:14px;font-weight:900;display:flex;flex-direction:column;gap:10px;align-items:center}
  .pausedMask .box button{border:1px solid #fff;background:#10b981;color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}

  @media (prefers-reduced-motion: reduce){
    .target.bounce{ animation:none !important; }
    .float{ animation:none !important; opacity:1; }
    .hitline-flash{ animation:none !important; }
    *{scroll-behavior:auto;}
  }
  @supports(height: 100dvh){ .game{ height:calc(100dvh - 16px); } }
  @media (max-width:380px){.title{font-size:13px}.chip{font-size:11px;padding:3px 8px}.target b{font-size:18px}}
</style>

<!-- ==== RFRoutines v0.4 (extiende v0.3; slide→swipe, windowMs, pesos, bonos) ==== -->
<script>
/* RFRoutines v0.4 — API compatible con v0.3: get(nivel, evento), toSpawnMs(bpm) */
const RFRoutines = (() => {
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const toSpawnMs=bpm=>Math.round(60000/ clamp(bpm,40,220));
  const normPesos=dest=>{
    const total=(dest.submovs||[]).reduce((a,s)=>a+(s.peso??0),0)||1;
    (dest.submovs||[]).forEach(s=>s.peso=+(((s.peso??0)/total).toFixed(2)));
    return dest;
  };
  const mapTipo=t=>({slide:'swipe'}[t]||t||'tap');

  /* ---- Pegamos las rutinas de v0.3 y mapeamos slide→swipe ---- */
  const SRC = window.RFRoutines && window.RFRoutines.get ? window.RFRoutines : null; // si venimos de builds previas
  function base(evento, nivel){
    try{
      const r = SRC ? SRC.get(nivel, evento) : null;
      if(!r) throw 0;
      r.destrezas = r.destrezas.map(d=>{
        d = normPesos(d);
        d.submovs = (d.submovs||[]).map(s=>({...s, tipo: mapTipo(s.tipo)}));
        return d;
      });
      return r;
    }catch(_){
      return null;
    }
  }

  // Para garantizar demo autónoma si no existe SRC (pero en tu repo ya existe)
  function fallback(){
    return {
      nivel:"Basico", evento:"Piso", bpm:96,
      destrezas:[
        normPesos({ id:"rodada-frente", nombre:"Rodada al frente",
          submovs:[
            {id:"tap-in",tipo:"tap",windowMs:120,peso:0.3},
            {id:"roll",tipo:"swipe",durBeats:1,windowMs:150,peso:0.4},
            {id:"tap-out",tipo:"tap",windowMs:120,peso:0.3}
          ]})
      ],
      bonos:[]
    };
  }

  const MAP={};
  ["Piso","Salto","Barra","Viga"].forEach(E=>{
    MAP[E]={};
    ["Baby","Basico","Intermedio"].forEach(N=>{
      MAP[E][N]= base(E,N) || fallback();
    });
  });

  return { get:(nivel,evento="Piso")=>{
    const E=String(evento||"Piso").trim(), N=String(nivel||"Basico").trim();
    if(!MAP[E]||!MAP[E][N]) throw new Error(`Rutina no encontrada: ${N} / ${E}`);
    return JSON.parse(JSON.stringify(MAP[E][N]));
  }, toSpawnMs };
})();
</script>

<script>
/* ===== Routines Flow — v0.24.0 (motor con tap/hold/swipe/multi) ===== */
const el=id=>document.getElementById(id), qsa=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}}, set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* Constantes UI */
const GAME_VERSION='v0.24.0';

/* Orden y datos base */
const ORDER=['salto','barra','viga','piso'];
const APP={salto:{label:'Salto',theme:'salto',color:'#10b981'}, barra:{label:'Barra',theme:'barra',color:'#6366f1'}, viga:{label:'Viga',theme:'viga',color:'#f59e0b'}, piso:{label:'Piso',theme:'piso',color:'#ec4899'}};
const LEVELS={baby:{label:'Baby Gym'}, basico:{label:'Básico'}, intermedio:{label:'Intermedio'}};

/* Geometría y juicio */
const LANES=4, HIT_Y=88, LINE_OFFSET=64, LINE_Y=HIT_Y+LINE_OFFSET, MISS_LINE_Y=HIT_Y-8, LANE_SPAN=560;
const PERFECT_FRAC=0.45; // 45% de la ventana temporal → perfecto; el resto good
const SWIPE_MIN_PX=50;

/* Preferencias del sistema */
const prefersReduced = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Estado */
let apparatus=LS.get('rf22:ap','salto');
let level=LS.get('rf22:lv','baby');
let running=false, paused=false, ended=false, startTs=null, timeline=0, raf=0;
let notes=[], hits={perfect:0,good:0,miss:0}, score=0, laneHits=[0,0,0,0];
let totalTarget=0, spawned=0, processed=0, nextSpawnAt=1400;

let routine=null, beatMs=0;
let currDestIndex=0, currSubIndex=0; // iterador destreza/submov

/* Anti taps final */
const END_GRACE_MS = 450;
let resultsUnlockTimer = 0;

/* Refs UI */
const lanesWrap=el('lanes'), hitline=el('hitline'), progBar=el('progBar'), pausedMask=el('pausedMask'), pauseBox=el('pauseBox'), resumeBtn=el('resumeBtn');
const scoreEl=el('score'), levelBadge=el('levelBadge'), apparatusLabel=el('apparatusLabel'), verBadge=el('verBadge');
const panel=el('panel'), results=el('results'), rName=el('rName'), rScore=el('rScore'), rPerfect=el('rPerfect'), rGood=el('rGood'), rMiss=el('rMiss'), medalEl=el('medal');
const startBtn=el('startBtn'), restartBtn=el('restartBtn'), pauseBtn=el('pauseBtn'), muteBtn=el('muteBtn'), muteIcon=el('muteIcon');
const playAgain=el('playAgain'), nextEvent=el('nextEvent'), toMain=el('toMain'), continueLastBtn=el('continueLast');
const nameInput=el('playerName'), apPills=el('apPills'), lvPills=el('lvPills');
const lbTable=el('lbTable'), lbBody=lbTable?lbTable.querySelector('tbody'):null, resetLBBtn=el('resetLB');

/* Audio */
const SFX=(()=>{let ctx=null,muted=LS.get('rf22:muted',false);
  const ensure=()=>{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx};
  const tone=(f=880,d=.06,type='sine',vol=.22)=>{if(muted)return;const c=ensure(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start();o.stop(t+d)};
  function setMuted(v){muted=!!v;LS.set('rf22:muted',muted);muteIcon.textContent=muted?'🔇':'🔊';muteBtn.setAttribute('aria-pressed',String(muted));}
  return {perfect:()=>tone(1046,.06,'square',.25),good:()=>tone(784,.06,'triangle',.22),miss:()=>tone(196,.08,'sawtooth',.18),resume:()=>{try{ensure().resume()}catch(_){}} ,setMuted,isMuted:()=>muted};
})();
addEventListener('pointerdown',()=>SFX.resume(),{once:true});
muteIcon.textContent=SFX.isMuted()?'🔇':'🔊'; muteBtn.setAttribute('aria-pressed',String(SFX.isMuted()));
function buzz(ms){try{if(navigator.vibrate) navigator.vibrate(ms);}catch(_){}}  

/* Carriles + input por gestos */
let laneEls=[], laneInput=[];
function buildLanes(){
  lanesWrap.innerHTML=''; laneEls.length=0; laneInput.length=0;
  for(let l=0;l<LANES;l++){
    const lane=document.createElement('div'); lane.className='lane';
    const label=document.createElement('div'); label.className='note-label'; label.textContent='';
    const target=document.createElement('button'); target.className='target'; target.type='button'; target.style.bottom=(HIT_Y-18)+'px';
    target.innerHTML=`<b class="laneCount">0</b>`;
    lane.appendChild(label); lane.appendChild(target); lanesWrap.appendChild(lane); laneEls.push(lane);

    laneInput[l]={down:false,downX:0,downY:0,downT:0,holding:null,swipe:false,multi:{count:0,need:0,expires:0}};

    target.addEventListener('pointerdown',e=>onDown(l,e),{passive:false});
    target.addEventListener('pointerup',e=>onUp(l,e),{passive:false});
    target.addEventListener('pointercancel',e=>onCancel(l,e),{passive:true});
    target.addEventListener('pointermove',e=>onMove(l,e),{passive:true});
  }
  hitline.style.bottom=(LINE_Y-3)+'px';
}
buildLanes();

/* Helpers UI */
function colorizeProgress(){const map={piso:'var(--accent)',viga:'var(--accent-alt)',salto:'var(--accent-salto)',barra:'var(--accent-barra)'};progBar.style.background=getComputedStyle(document.documentElement).getPropertyValue(map[apparatus])||APP[apparatus].color;}
function refreshBadges(){apparatusLabel.textContent=APP[apparatus].label;levelBadge.textContent=(LEVELS[level]?.label||'').toUpperCase();colorizeProgress();}
function updateLaneCounters(onlyLane){if(onlyLane===undefined){for(let l=0;l<LANES;l++){const t=laneEls[l]?.querySelector('.laneCount'); if(t) t.textContent=laneHits[l];}}else{const t=laneEls[onlyLane]?.querySelector('.laneCount'); if(t) t.textContent=laneHits[onlyLane];}}

/* Rutina (v0.4) */
const AP_TO_EVENT={piso:'Piso', salto:'Salto', barra:'Barra', viga:'Viga'};
const LV_TO_NAME={baby:'Baby', basico:'Basico', intermedio:'Intermedio'};

function loadRoutine(){
  try{
    const evento=AP_TO_EVENT[apparatus]||'Piso';
    const nivel =LV_TO_NAME[level]||'Basico';
    routine = RFRoutines.get(nivel, evento);
    beatMs = RFRoutines.toSpawnMs(routine.bpm);
    return true;
  }catch(e){ console.warn('RFRoutines.get error',e); routine=null; beatMs=0; return false; }
}

function currentDest(){ return routine?.destrezas?.[currDestIndex]||null; }
function currentSub(){ const d=currentDest(); return d?.submovs?.[currSubIndex]||null; }

/* Progreso */
function updateProgressBar(){ const tgt=totalTarget?Math.min(100,(processed/totalTarget)*100):0; progBar.style.width=tgt.toFixed(2)+'%'; }

/* UI init */
function initUI(){
  el('verBadge').textContent = GAME_VERSION;
  nameInput.value=LS.get('rf22:name','Gimnasta');
  qsa('#apPills .pill').forEach(p=>p.classList.toggle('on',p.dataset.ap===apparatus));
  qsa('#lvPills .pill').forEach(p=>p.classList.toggle('on',p.dataset.lv===level));
  refreshBadges();updateLaneCounters();renderLeaderboard();
  continueLastBtn.style.display=LS.get('rf22:last:run',null)?'':'';
}
initUI();

/* Leaderboard */
function lbKey(){return `rf22:lb:${apparatus}:${level}`;}
function saveLeaderboard(medal,emoji){const k=lbKey();const cur=LS.get(k,[]);cur.push({name:nameInput.value||'Gimnasta',score,medal,medalEmoji:emoji,date:new Date().toISOString()});cur.sort((a,b)=>b.score-a.score);cur.splice(10);LS.set(k,cur);}
function renderLeaderboard(){if(!lbBody)return;const data=LS.get(lbKey(),[]);lbBody.innerHTML='';data.forEach((r,i)=>{const tr=document.createElement('tr');const premio=(r.medalEmoji||'')+' '+(r.medal?(r.medal[0].toUpperCase()+r.medal.slice(1)):'');tr.innerHTML=`<td class="pos">${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${premio}</td><td>${new Date(r.date).toLocaleDateString()}</td>`;lbBody.appendChild(tr);});}
if(resetLBBtn){resetLBBtn.onclick=()=>{if(confirm('¿Reiniciar el ranking local para este aparato y nivel?')){LS.set(lbKey(),[]);renderLeaderboard();}}}

/* URL params */
(function(){ try{const u=new URL(location.href);const ap=u.searchParams.get('ap');const lv=u.searchParams.get('lv');const nm=u.searchParams.get('name');if(ap&&APP[ap]){apparatus=ap;LS.set('rf22:ap',ap);} if(lv&&LEVELS[lv]){level=lv;LS.set('rf22:lv',lv);} if(nm){LS.set('rf22:name',nm);} }catch(_){}})();

/* ======= Generación de notas por SUBMOV ======= */
function totalSubmovs(){ return routine?.destrezas?.reduce((a,d)=>a+(d.submovs?.length||0),0)||0; }

function nextSpawnIntervalFor(sub){
  const beats = Math.max(1, Number(sub?.durBeats||1));
  return beats * (beatMs||800);
}

function genNextNote(timeBase){
  const d = currentDest();
  const s = currentSub();
  if(!d || !s) return [];

  const lane=Math.floor(Math.random()*LANES), id=(spawned+1);
  const label = d.nombre || d.id || 'Destreza';
  const tipo = (s.tipo||'tap');
  const peso = Math.max(0, Number(s.peso||1));
  const windowMs = Math.max(60, Number(s.windowMs||120)); // seguridad
  const needCount = (tipo==='multi') ? Math.max(2, Math.round(Number(s.durBeats||2))) : 1;
  spawned++;

  // etiqueta fija de carril con la destreza
  const laneLabel = laneEls[lane]?.querySelector('.note-label'); if(laneLabel) laneLabel.textContent = label;

  // avanzar iterador de submov → destreza
  currSubIndex++;
  if(currSubIndex >= (d.submovs?.length||0)){ currSubIndex=0; currDestIndex++; }

  return [{id,time:timeBase,lane,label,tipo,peso,windowMs,need:needCount,hit:false,inProgress:false,hold:{start:0,durMs:0},multi:{count:0,deadline:0},el:null}];
}

/* Kinemática */
function fallMsNow(){
  const base=3600, p=totalTarget?Math.min(1,processed/totalTarget):0;
  return Math.max(400, base*(1-0.18*p));
}
function noteY(n,now){ const lead=1100, t0=n.time-lead, k=(now-t0)/fallMsNow(); return HIT_Y + (1-k)*LANE_SPAN; }

/* Limpieza */
function purgeNotesDOM(){ qsa('.note').forEach(x=>x.remove()); for(const n of notes){ if(n.el){try{n.el.remove()}catch(_){}} } notes=[]; }

/* Loop principal */
function loop(ts){
  if(!running) return;
  if(!startTs) startTs = ts || performance.now();
  const now = ts || performance.now();
  timeline = now - startTs;

  if(!paused){
    while(spawned<totalTarget && timeline>=nextSpawnAt){
      const newOnes = genNextNote(nextSpawnAt);
      notes = notes.concat(newOnes);
      const last = newOnes[0];
      nextSpawnAt += nextSpawnIntervalFor(last); // usa beats de submov
    }
    updateNotes();
    if(processed>=totalTarget && notes.length===0){ endGame(); return; }
  }
  raf = requestAnimationFrame(loop);
}

/* Control */
function startGame(){
  if(raf) cancelAnimationFrame(raf);
  purgeNotesDOM();
  ended=false; running=true; paused=false; pauseBtn.textContent='⏸'; pausedMask.style.display='none';
  LS.set('rf22:name',nameInput.value||'Gimnasta'); LS.set('rf22:ap',apparatus); LS.set('rf22:lv',level);
  hits={perfect:0,good:0,miss:0}; score=0; laneHits=[0,0,0,0];

  loadRoutine();
  currDestIndex=0; currSubIndex=0;

  totalTarget = totalSubmovs(); spawned=0; processed=0;
  const firstSub = currentSub() || {durBeats:1};
  nextSpawnAt = nextSpawnIntervalFor(firstSub);

  // limpia etiquetas
  for(const lane of laneEls){ const lbl=lane.querySelector('.note-label'); if(lbl) lbl.textContent=''; }

  updateProgressBar(); updateLaneCounters(); updateHUD();
  startTs=null; timeline=0; progBar.style.width='0%';
  results.style.display='none'; results.classList.remove('locked');
  [playAgain,nextEvent,toMain].forEach(b=>b.disabled=false);
  panel.style.display='none';
  resetLine(); requestAnimationFrame(loop);
}

function endGame(){
  running=false; ended=true; if(raf) cancelAnimationFrame(raf);
  purgeNotesDOM();

  const totalHit=hits.perfect+hits.good+hits.miss, acc= totalHit? (hits.perfect/totalHit):0;
  const medal= acc>=0.8?'oro': acc>=0.55?'plata':'bronce';
  const emoji= medal==='oro'?'🥇': medal==='plata'?'🥈':'🥉';
  medalEl.textContent=`${emoji} ${medal[0].toUpperCase()+medal.slice(1)}`;
  rName.textContent=nameInput.value||'Gimnasta';
  rScore.textContent=score; rPerfect.textContent=hits.perfect; rGood.textContent=hits.good; rMiss.textContent=hits.miss;

  // limpia etiquetas
  for(const lane of laneEls){ const lbl=lane.querySelector('.note-label'); if(lbl) lbl.textContent=''; }

  results.style.display='flex';
  results.classList.add('locked');
  [playAgain,nextEvent,toMain].forEach(b=>b.disabled=true);
  document.activeElement && document.activeElement.blur && document.activeElement.blur();

  clearTimeout(resultsUnlockTimer);
  resultsUnlockTimer = setTimeout(()=>{
    results.classList.remove('locked');
    [playAgain,nextEvent,toMain].forEach(b=>b.disabled=false);
  }, END_GRACE_MS);

  applyBonuses(); // bonos de serie/conexión al final
  saveLeaderboard(medal,emoji); renderLeaderboard(); saveLastRun();
}

/* Render de notas */
function updateNotes(){
  const now=timeline; const keep=[];
  for(const n of notes){
    const y = noteY(n, now);
    if(!n.hit && y <= MISS_LINE_Y && !n.inProgress){
      registerMiss(n);
      continue;
    }
    if(!n.hit){
      if(!n.el){
        const b=document.createElement('div'); b.className='note '+APP[apparatus].theme; b.textContent='';
        b.addEventListener('pointerdown',e=>{e.preventDefault();onDown(n.lane,e);},{passive:false});
        laneEls[n.lane].appendChild(b); n.el=b;
      }
      n.el.style.bottom=Math.max(10,y)+'px'; keep.push(n);
    }
  }
  notes=keep;
}

/* ======= GESTOS ======= */
function onDown(l,e){
  if(!running || paused || ended) return;
  e.preventDefault();
  laneEls[l].querySelector('.target')?.classList.add('bounce');
  const st=laneInput[l]; st.down=true; st.downX=e.clientX||0; st.downY=e.clientY||0; st.downT=timeline; st.swipe=false;

  const note = pickCand(l);
  if(!note) return;

  if(note.tipo==='hold'){
    const ok = tryJudgeWindow(note); // valida timing inicial
    if(!ok) return;
    note.inProgress=true; st.holding=note;
    const beats = Math.max(1, Number(currentHoldBeats(note)));
    note.hold.start = timeline;
    note.hold.durMs = beats * beatMs;
  }else if(note.tipo==='tap'){
    finalizeHit(note, 'tap');
  }else if(note.tipo==='multi'){
    // primera pulsación cuenta
    if(note.multi.count===0){
      const ok = tryJudgeWindow(note);
      if(!ok) return;
      note.multi.deadline = timeline + nextSpawnIntervalFor(note); // duración del multi (≈ durBeats)
    }
    note.multi.count++;
    if(note.multi.count >= (note.need||2)){
      finalizeHit(note, 'multi');
    }
  }
}
function onMove(l,e){
  const st=laneInput[l]; if(!st.down) return;
  const dx=(e.clientX||0)-st.downX, dy=(e.clientY||0)-st.downY;
  if(Math.hypot(dx,dy)>=SWIPE_MIN_PX) st.swipe=true;
  // hold feedback opcional: podríamos dibujar barra de progreso (omito para mantener limpio)
}
function onUp(l,e){
  const st=laneInput[l];
  if(!running || paused || ended || !st.down){ st.down=false; return; }
  st.down=false;

  const note = pickCand(l);
  if(st.holding){
    const n=st.holding;
    if(n!==note && n.el){ /* seguimos con la misma nota en hold hasta soltar */ }
    const held = timeline - n.hold.start;
    if(held + 40 >= n.hold.durMs){ // pequeña holgura
      finalizeHit(n, 'hold');
    }else{
      // soltó antes
      registerMiss(n);
    }
    laneInput[l].holding=null;
    return;
  }

  if(note && note.tipo==='swipe' && st.swipe){
    const ok = tryJudgeWindow(note);
    if(ok) finalizeHit(note,'swipe');
  }
  // multi también puede aceptar taps adicionales aquí si quisieras duplicar; ya contamos en down.
}
function onCancel(l,_e){ const st=laneInput[l]; st.down=false; if(st.holding){ registerMiss(st.holding); st.holding=null; } }

/* Candidadta: nota más cercana a la línea en el carril */
function pickCand(lane){
  const now=timeline;
  return notes.filter(n=>n.lane===lane && !n.hit).map(n=>({n,y:noteY(n,now)})).sort((a,b)=>Math.abs(a.y-LINE_Y)-Math.abs(b.y-LINE_Y))[0]?.n || null;
}

/* Ventana temporal → tolerancia espacial dinámica */
function windowToRadiusPx(note){
  const pxPerMs = LANE_SPAN / fallMsNow();
  const maxR = (note.windowMs||120) * pxPerMs;
  const goodR = Math.max(16, Math.min(64, maxR));     // clamp razonable
  const perfectR = Math.max(8, Math.min(goodR, goodR*PERFECT_FRAC));
  return {perfectR, goodR};
}
function tryJudgeWindow(note){
  const y=noteY(note,timeline), dy=Math.abs(y-LINE_Y);
  const {perfectR,goodR}=windowToRadiusPx(note);
  return dy<=goodR;
}

/* Finalizar acierto */
function finalizeHit(note, kind){
  const y=noteY(note,timeline), dy=Math.abs(y-LINE_Y);
  const {perfectR,goodR}=windowToRadiusPx(note);
  const rank = (dy<=perfectR)?'perfect':'good';

  note.hit=true; processed++;
  if(note.el){note.el.remove(); note.el=null;}

  const base = (rank==='perfect')?100:60;
  const delta = Math.round(base * Math.max(0.1, Number(note.peso||1)));
  if(rank==='perfect'){hits.perfect++;score+=delta;SFX.perfect();buzz(18);}else{hits.good++;score+=delta;SFX.good();buzz(12);}
  laneHits[note.lane]++; updateLaneCounters(note.lane);
  flashLine(rank); floatText(note.lane, `${rank==='perfect'?'Perfect':'Good'} +${delta}`, rank);
  updateHUD(); updateProgressBar();

  // limpiar etiqueta si no quedan notas visibles en el carril
  const hasFuture = notes.some(x=>!x.hit && x.lane===note.lane && x.el);
  if(!hasFuture){ const lbl=laneEls[note.lane]?.querySelector('.note-label'); if(lbl) lbl.textContent=''; }
}

/* Miss */
function registerMiss(note){
  note.hit=true; processed++;
  if(note.el){note.el.remove(); note.el=null;}
  hits.miss++; flashLine('miss'); floatText(note.lane,'Miss','miss'); SFX.miss(); buzz(40);
  updateHUD(); updateProgressBar();
}

/* Bonos serie/conexión (aplicados al final por simplicidad) */
function applyBonuses(){
  const bonos = routine?.bonos||[];
  if(!bonos.length) return;
  // Por ahora aplicamos un bono global aproximado: suma de valores * 1% del score
  // (Si quieres, en siguiente build podemos rastrear transiciones exactas por IDs)
  const extraPct = bonos.reduce((a,b)=>a+Number(b.valor||0),0);
  const extra = Math.round(score * extraPct);
  if(extra>0){ score += extra; rScore.textContent=score; floatText(1,`Bonus +${extra}`,'good'); }
}

/* Feedback línea */
let lineTimer=0; function resetLine(){hitline.className='hitline-global';}
function flashLine(kind){ resetLine(); hitline.classList.add(kind==='perfect'?'hitline-perfect':kind==='good'?'hitline-good':'hitline-miss','hitline-flash'); clearTimeout(lineTimer); lineTimer=setTimeout(resetLine,300); }
function floatText(lane,text,kind){ const ln=laneEls[lane]; const s=document.createElement('div'); s.className=`float ${kind}`; s.style.bottom=(LINE_Y+12)+'px'; s.textContent=text; ln.appendChild(s); setTimeout(()=>{ try{s.remove()}catch(_){}} , prefersReduced ? 1 : 650); }

/* HUD + progreso */
function updateHUD(){scoreEl.textContent=score;}

/* Persistencia */
function saveLastRun(){LS.set('rf22:last:run',{when:Date.now(),apparatus,level,score,hits});}
function restoreLastRun(){const r=LS.get('rf22:last:run',null);if(!r)return false;apparatus=r.apparatus||apparatus;level=r.level||level;return true;}

/* Navegación */
function nextApparatus(){const idx=ORDER.indexOf(apparatus);apparatus=ORDER[(idx+1)%ORDER.length];LS.set('rf22:ap', apparatus);refreshBadges();}
function goToMain(){results.style.display='none';panel.style.display='';score=0;hits={perfect:0,good:0,miss:0};updateHUD();}

/* Listeners UI */
startBtn.onclick=startGame;
restartBtn.onclick=()=>startGame();
pauseBtn.onclick=()=>{ if(!running) return; paused=!paused; pauseBtn.textContent=paused?'▶':'⏸'; pausedMask.style.display=paused?'flex':'none';
  if(!paused){const now=performance.now();startTs=now - timeline;resetLine();requestAnimationFrame(loop);}else if(raf){cancelAnimationFrame(raf);} };
resumeBtn.onclick=()=>pauseBtn.click();
pausedMask.addEventListener('pointerdown',()=>{ if(paused) pauseBtn.click(); });
pauseBox.addEventListener('pointerdown',e=>e.stopPropagation());

muteBtn.onclick=()=>SFX.setMuted(!SFX.isMuted());
playAgain.onclick=()=>startGame();
nextEvent.onclick=()=>{nextApparatus();startGame();};
toMain.onclick=()=>goToMain();
continueLastBtn.onclick=()=>{if(restoreLastRun()){qsa('#apPills .pill').forEach(p=>p.classList.toggle('on',p.dataset.ap===apparatus));qsa('#lvPills .pill').forEach(p=>p.classList.toggle('on',p.dataset.lv===level));refreshBadges();startGame();}};

/* Aparato/Nivel */
apPills.addEventListener('pointerdown',e=>{const b=e.target.closest('.pill'); if(!b)return; qsa('#apPills .pill').forEach(p=>p.classList.remove('on')); b.classList.add('on'); apparatus=b.dataset.ap; LS.set('rf22:ap', apparatus); refreshBadges(); loadRoutine(); renderLeaderboard();},{passive:true});
lvPills.addEventListener('pointerdown',e=>{const b=e.target.closest('.pill'); if(!b)return; qsa('#lvPills .pill').forEach(p=>p.classList.remove('on')); b.classList.add('on'); level=b.dataset.lv; LS.set('rf22:lv',level); levelBadge.textContent=(LEVELS[level]?.label||'').toUpperCase(); loadRoutine(); renderLeaderboard();},{passive:true});
nameInput.onchange=()=>LS.set('rf22:name',nameInput.value||'Gimnasta');

/* Teclado: 1–4 (tap) */
addEventListener('keydown',(e)=>{ if(!running || paused || ended) return; const map={'1':0,'2':1,'3':2,'4':3}; if(e.key in map){ e.preventDefault(); onDown(map[e.key],{clientX:0,clientY:0}); onUp(map[e.key],{}); } },{passive:false});

/* Auto-pausa */
document.addEventListener('visibilitychange',()=>{ if(document.hidden && running && !paused) pauseBtn.click(); });

/* Inicial */
(function(){ loadRoutine(); totalTarget = totalSubmovs(); colorizeProgress(); renderLeaderboard(); continueLastBtn.style.display=LS.get('rf22:last:run',null)?'':''; })();

/* Utilidad: beats de hold del note (si vino de submov) */
function currentHoldBeats(note){
  // usamos need como aproximación si durBeats>1 en hold
  return Math.max(1, note.need || 1);
}
</script>
